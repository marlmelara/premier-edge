# Same-day follow-up pings.
#
# The sweep endpoint is idempotent and time-driven, so calling it often is
# harmless — but Vercel's Hobby plan caps crons at once per day, which turns the
# "check in a few hours later" nudge into "check in tomorrow morning". This
# workflow closes that gap for free: it hits the same endpoint hourly through
# the seller-facing day (8am–9pm ET), and vercel.json keeps the daily run as a
# backstop.
#
# Setup — ONE repo secret, under Settings → Secrets and variables → Actions:
#
#   CRON_SECRET   same value as the Vercel production env var
#
# Until that exists the job skips with a warning instead of failing: a missing
# optional secret is not a broken build, and an hourly red X trains you to stop
# reading the Actions tab. A real HTTP failure still fails loudly.
#
# The URL is not a secret — it's the public production origin. Override it for a
# different deployment with a repo *variable* named PREMIER_EDGE_URL.
#
# Delete this file if the account moves to Vercel Pro; a per-minute cron there
# does the same job without GitHub in the path. Note that GitHub disables
# scheduled workflows on repos with no activity for 60 days.

name: Follow-up sweep

on:
  schedule:
    - cron: "0 12-23,0-1 * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Draft due follow-ups
        env:
          BASE_URL: ${{ vars.PREMIER_EDGE_URL || 'https://premier-edge-theta.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not set, so the sweep was skipped. Add it under Settings → Secrets and variables → Actions to enable same-day follow-ups."
            exit 0
          fi

          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/followups")
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"

          # A non-200 means the sweep did not run. That is a real failure worth
          # an email — unlike missing setup, it means follow-ups are silently
          # not going out.
          [ "$status" = "200" ] || { echo "::error::sweep returned HTTP $status"; exit 1; }
